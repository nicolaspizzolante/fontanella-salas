# Levanta todo con: docker compose up --build   →  http://localhost:3000
# Para desarrollar: docker compose up -d db  +  npm run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salas
      POSTGRES_PASSWORD: salas
      POSTGRES_DB: salas
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # Volumen con nombre: las reservas sobreviven a reinicios del contenedor.
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salas -d salas"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://salas:salas@db:5432/salas
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
